<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-cars" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="currentColor" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#141712"/>
  <rect width="100%" height="100%" fill="url(#grid-cars)" stroke="#FF4D1C" stroke-opacity="0.2"/>
  
  <!-- Frame corners -->
  <path d="M 20 40 L 20 20 L 40 20 M 760 20 L 780 20 L 780 40 M 780 460 L 780 480 L 760 480 M 40 480 L 20 480 L 20 460" 
        fill="none" stroke="#FF4D1C" stroke-width="2" stroke-linecap="square"/>

  <!-- Left: Vehicle Blueprint & Specs Matrix -->
  <g transform="translate(50, 105)">
    <!-- Main Vehicle Display Card -->
    <rect x="0" y="0" width="420" height="330" fill="#0B0D0A" stroke="#7CFF6B" stroke-width="1.2"/>
    
    <!-- Wireframe Car Silhouette Simulator -->
    <rect x="15" y="15" width="390" height="150" fill="#1C2419" stroke="#7CFF6B" stroke-dasharray="2 3"/>
    <path d="M 60 120 L 90 75 L 180 60 L 260 60 L 320 85 L 350 120 Z" fill="none" stroke="#7CFF6B" stroke-width="2"/>
    <circle cx="120" cy="120" r="22" fill="none" stroke="#FF4D1C" stroke-width="2"/>
    <circle cx="120" cy="120" r="8" fill="#FF4D1C"/>
    <circle cx="290" cy="120" r="22" fill="none" stroke="#FF4D1C" stroke-width="2"/>
    <circle cx="290" cy="120" r="8" fill="#FF4D1C"/>
    <text x="210" y="45" text-anchor="middle" fill="#7CFF6B" font-family="monospace" font-size="11">> VEHICLE WIREFRAME HUD</text>

    <!-- Specs Grid -->
    <g transform="translate(15, 180)">
      <rect x="0" y="0" width="185" height="40" fill="#141712" stroke="#7CFF6B" stroke-opacity="0.3"/>
      <text x="10" y="16" fill="#A0AEA0" font-family="monospace" font-size="9">ENGINE SPECS:</text>
      <text x="10" y="32" fill="#7CFF6B" font-family="monospace" font-size="11" font-weight="bold">2.0L TURBO // 248 HP</text>

      <rect x="205" y="0" width="185" height="40" fill="#141712" stroke="#7CFF6B" stroke-opacity="0.3"/>
      <text x="10" y="16" fill="#A0AEA0" font-family="monospace" font-size="9">BODY &amp; COLOR:</text>
      <text x="10" y="32" fill="#E6EFE4" font-family="monospace" font-size="11" font-weight="bold">SEDAN / METALLIC GRAY</text>

      <rect x="0" y="50" width="185" height="40" fill="#141712" stroke="#7CFF6B" stroke-opacity="0.3"/>
      <text x="10" y="16" fill="#A0AEA0" font-family="monospace" font-size="9">FUEL TYPE:</text>
      <text x="10" y="32" fill="#FF4D1C" font-family="monospace" font-size="11" font-weight="bold">HYBRID / PETROL</text>

      <rect x="205" y="50" width="185" height="40" fill="#141712" stroke="#7CFF6B" stroke-opacity="0.3"/>
      <text x="10" y="16" fill="#A0AEA0" font-family="monospace" font-size="9">TRANSMISSION &amp; ODO:</text>
      <text x="10" y="32" fill="#E6EFE4" font-family="monospace" font-size="11" font-weight="bold">AUTO 8-SPD / 34,200 KM</text>

      <text x="0" y="115" fill="#A0AEA0" font-family="monospace" font-size="10">PRICE: $24,500 // VERIFIED TITLE</text>
    </g>
  </g>

  <!-- Right: Interactive Engagement Panel (Contact Seller + Book Test Drive) -->
  <g transform="translate(495, 105)">
    <rect x="0" y="0" width="255" height="330" fill="#0B0D0A" stroke="#FF4D1C" stroke-width="1.2"/>
    <text x="15" y="30" fill="#FF4D1C" font-family="monospace" font-size="11" font-weight="bold">CUSTOMER DISPATCH TERMINAL</text>
    <line x1="15" y1="42" x2="240" y2="42" stroke="#FF4D1C" stroke-opacity="0.4"/>

    <!-- Contact Seller Button Simulator -->
    <rect x="15" y="65" width="225" height="45" fill="#FF4D1C" rx="2"/>
    <text x="127" y="92" text-anchor="middle" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">CONTACT SELLER [DIRECT]</text>

    <!-- Test Drive Booking Simulator -->
    <rect x="15" y="130" width="225" height="110" fill="#1C2419" stroke="#7CFF6B" stroke-dasharray="2 2"/>
    <text x="25" y="152" fill="#7CFF6B" font-family="monospace" font-size="10" font-weight="bold">BOOK TEST DRIVE</text>
    <rect x="25" y="165" width="205" height="26" fill="#0B0D0A" stroke="#7CFF6B" stroke-width="0.8"/>
    <text x="35" y="182" fill="#E6EFE4" font-family="monospace" font-size="10">SELECT DATE: 2026-10-18</text>
    <rect x="25" y="200" width="205" height="30" fill="#7CFF6B" rx="1"/>
    <text x="127" y="220" text-anchor="middle" fill="#0B0D0A" font-family="monospace" font-size="10" font-weight="bold">CONFIRM TEST DRIVE APPOINTMENT</text>

    <!-- Status -->
    <rect x="15" y="260" width="225" height="45" fill="#141712" stroke="#A0AEA0" stroke-width="0.8"/>
    <text x="25" y="280" fill="#A0AEA0" font-family="monospace" font-size="9">DEALER DISPATCH: ACTIVE</text>
    <text x="25" y="295" fill="#7CFF6B" font-family="monospace" font-size="9">INSTANT SMS / EMAIL CONFIRM</text>
  </g>

  <!-- Blueprint Header -->
  <text x="50" y="60" fill="#FF4D1C" font-family="monospace" font-size="14" letter-spacing="3" font-weight="bold">MISSION BRIEF // USED CARS PLATFORM</text>
  <text x="50" y="80" fill="#A0AEA0" font-family="monospace" font-size="11" letter-spacing="1">SPECS MATRIX + CONTACT SELLER DISPATCH + TEST DRIVE SCHEDULER</text>
  <text x="750" y="60" text-anchor="end" fill="#FF4D1C" font-family="monospace" font-size="12" letter-spacing="2">SYS-CODE: AUTO-SPEC-02</text>
  <text x="750" y="465" text-anchor="end" fill="#FF4D1C" font-family="monospace" font-size="11">INVENTORY STATUS: ONLINE</text>
</svg>
