<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid-blog" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="currentColor" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="#141712"/>
  <rect width="100%" height="100%" fill="url(#grid-blog)" stroke="#FF4D1C" stroke-opacity="0.15"/>
  
  <!-- Frame corners -->
  <path d="M 20 40 L 20 20 L 40 20 M 760 20 L 780 20 L 780 40 M 780 460 L 780 480 L 760 480 M 40 480 L 20 480 L 20 460" 
        fill="none" stroke="#FF4D1C" stroke-width="2" stroke-linecap="square"/>
        
  <!-- Wireframe layout boxes -->
  <rect x="70" y="110" width="660" height="40" fill="none" stroke="#FF4D1C" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="90" y="135" fill="#FF4D1C" font-family="monospace" font-size="12" letter-spacing="2">HEADER NAV // CATEGORY FILTERS // SEARCH TAXONOMY</text>
  
  <!-- Grid cards -->
  <rect x="70" y="170" width="200" height="220" fill="none" stroke="#A0AEA0" stroke-width="1.5" opacity="0.4"/>
  <line x1="70" y1="270" x2="270" y2="270" stroke="#A0AEA0" stroke-width="1" opacity="0.3"/>
  <line x1="90" y1="300" x2="250" y2="300" stroke="#FF4D1C" stroke-width="2" opacity="0.8"/>
  <line x1="90" y1="320" x2="220" y2="320" stroke="#A0AEA0" stroke-width="1" opacity="0.5"/>
  <line x1="90" y1="340" x2="180" y2="340" stroke="#A0AEA0" stroke-width="1" opacity="0.5"/>
  
  <rect x="300" y="170" width="200" height="220" fill="none" stroke="#A0AEA0" stroke-width="1.5" opacity="0.4"/>
  <line x1="300" y1="270" x2="500" y2="270" stroke="#A0AEA0" stroke-width="1" opacity="0.3"/>
  <line x1="320" y1="300" x2="480" y2="300" stroke="#FF4D1C" stroke-width="2" opacity="0.8"/>
  <line x1="320" y1="320" x2="450" y2="320" stroke="#A0AEA0" stroke-width="1" opacity="0.5"/>
  <line x1="320" y1="340" x2="400" y2="340" stroke="#A0AEA0" stroke-width="1" opacity="0.5"/>

  <rect x="530" y="170" width="200" height="220" fill="none" stroke="#A0AEA0" stroke-width="1.5" opacity="0.4"/>
  <line x1="530" y1="270" x2="730" y2="270" stroke="#A0AEA0" stroke-width="1" opacity="0.3"/>
  <line x1="550" y1="300" x2="710" y2="300" stroke="#FF4D1C" stroke-width="2" opacity="0.8"/>
  <line x1="550" y1="320" x2="680" y2="320" stroke="#A0AEA0" stroke-width="1" opacity="0.5"/>
  <line x1="550" y1="340" x2="630" y2="340" stroke="#A0AEA0" stroke-width="1" opacity="0.5"/>
  
  <text x="50" y="60" fill="#FF4D1C" font-family="monospace" font-size="14" letter-spacing="3" font-weight="bold">OPERATION // CHRONICLE</text>
  <text x="50" y="80" fill="#A0AEA0" font-family="monospace" font-size="11" letter-spacing="1">PROJECT: RESPONSIVE BLOG (BOOTSTRAP + HTML5 + CSS3)</text>
  <text x="750" y="60" text-anchor="end" fill="#FF4D1C" font-family="monospace" font-size="12" letter-spacing="2">SYS-CODE: WEB-BST-02</text>
  <text x="750" y="460" text-anchor="end" fill="#FF4D1C" font-family="monospace" font-size="11">VIEWPORT ADAPTIVE // 100% RESPONSIVE</text>
</svg>
